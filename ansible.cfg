[defaults]
host_key_checking = False
remote_user = ec2-user
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml

[inventory]
# IMPORTANTE: inclua auto/script/host_list — o AAP injeta o inventário (ex: INV-LOCAL)
# como script; sem esses plugins o parse falha com "No inventory was parsed".
enable_plugins = host_list, script, auto, yaml, ini, toml, constructed, amazon.aws.aws_ec2, cloud.terraform.terraform_state

[ssh_connection]
pipelining = True
