---
# Job Templates da demo (Configuration-as-Code)
controller_templates:
  - name: BT - 10 Provision Infra (TFE)
    organization: BT
    project: PROJ-TERRAFORM
    playbook: playbooks/10_provision_infra.yml
    inventory: INV-LOCAL
    credentials:
      - Terraform Enterprise credential
    execution_environment: ee-demo-lab-bt

  - name: BT - 20 Configure Web Servers
    organization: BT
    project: PROJ-TERRAFORM
    playbook: playbooks/20_configure_webservers.yml
    inventory: INV-TERRAFORM
    credentials:
      - CRED-BT-SSH
    execution_environment: ee-demo-lab-bt

  - name: BT - 30 Deploy Application
    organization: BT
    project: PROJ-TERRAFORM
    playbook: playbooks/30_deploy_app.yml
    inventory: INV-TERRAFORM
    credentials:
      - CRED-BT-SSH
    execution_environment: ee-demo-lab-bt
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Versão da aplicação
          variable: app_version
          type: text
          default: v1.0
          required: true

  - name: BT - 40 Compliance Checks
    organization: BT
    project: PROJ-TERRAFORM
    playbook: playbooks/40_compliance.yml
    inventory: INV-TERRAFORM
    credentials:
      - CRED-BT-SSH
    execution_environment: ee-demo-lab-bt

  - name: BT - 45 Update Load Balancer
    organization: BT
    project: PROJ-TERRAFORM
    playbook: playbooks/45_update_loadbalancer.yml
    inventory: INV-TERRAFORM
    credentials:
      - CRED-BT-AWS
    execution_environment: ee-demo-lab-bt

  - name: BT - 50 Update ServiceNow
    organization: BT
    project: PROJ-TERRAFORM
    playbook: playbooks/50_update_servicenow.yml
    inventory: INV-TERRAFORM
    # Sem credencial ServiceNow: o playbook 50 é tolerante e roda em modo
    # simulado quando SN_HOST não está definido. Para ITSM real, crie uma
    # credencial custom CRED-BT-SNOW e adicione-a aqui.
    execution_environment: ee-demo-lab-bt

  - name: BT - 60 Update Application (Day 2)
    organization: BT
    project: PROJ-TERRAFORM
    playbook: playbooks/60_update_app.yml
    inventory: INV-TERRAFORM
    credentials:
      - CRED-BT-SSH
    execution_environment: ee-demo-lab-bt
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Nova versão da aplicação
          variable: app_version
          type: text
          default: v2.0
          required: true

  - name: BT - 80 Snapshot Volumes
    organization: BT
    project: PROJ-TERRAFORM
    playbook: playbooks/80_snapshot_volumes.yml
    inventory: INV-TERRAFORM
    credentials:
      - CRED-BT-AWS
    execution_environment: ee-demo-lab-bt

  - name: BT - 90 Destroy Infra (TFE)
    organization: BT
    project: PROJ-TERRAFORM
    playbook: playbooks/90_destroy_infra.yml
    inventory: INV-LOCAL
    credentials:
      - Terraform Enterprise credential
    execution_environment: ee-demo-lab-bt
