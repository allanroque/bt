---
# Configuration-as-Code (collection infra.aap_configuration)
# Tipo de credencial customizada para o Terraform Enterprise.
# Injeta as variáveis de ambiente usadas pelos playbooks e pelo inventário dinâmico.
# (Já criado no AAP via MCP como credential type id 73 — este arquivo mantém o CaC idempotente.)
controller_credential_types:
  - name: Terraform Enterprise Token
    description: Token de API e endereço do Terraform Enterprise
    kind: cloud
    inputs:
      fields:
        - id: tfe_hostname
          type: string
          label: TFE Hostname
        - id: tfe_organization
          type: string
          label: TFE Organization
        - id: tfe_token
          type: string
          label: TFE API Token
          secret: true
      required:
        - tfe_hostname
        - tfe_token
    injectors:
      env:
        # !unsafe preserva os templates para serem resolvidos pelo motor de credenciais em runtime
        TFE_HOSTNAME: !unsafe "{{ tfe_hostname }}"
        TFE_ORGANIZATION: !unsafe "{{ tfe_organization }}"
        TFE_TOKEN: !unsafe "{{ tfe_token }}"
        # Token no formato esperado pelo backend remote do Terraform CLI.
        # Codificação do host: ponto -> "_", hífen -> "__" (duplo).
        # showroom-2mf4p-1.apps.ocpv05.rhdp.net -> showroom__2mf4p__1_apps_ocpv05_rhdp_net
        TF_TOKEN_showroom__2mf4p__1_apps_ocpv05_rhdp_net: !unsafe "{{ tfe_token }}"
