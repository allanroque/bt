---
# Configuration-as-Code (collection infra.aap_configuration / antiga infra.controller_configuration)
# Tipo de credencial customizada para o Terraform Enterprise.
# Injeta as variáveis de ambiente usadas pelos playbooks e pelo inventário dinâmico.
controller_credential_types:
  - name: Terraform Enterprise Token
    description: Token de API e endereço do Terraform Enterprise
    kind: cloud
    inputs:
      fields:
        - id: tfe_hostname
          type: string
          label: TFE Hostname
        - id: tfe_organization
          type: string
          label: TFE Organization
        - id: tfe_token
          type: string
          label: TFE API Token
          secret: true
      required:
        - tfe_hostname
        - tfe_token
    injectors:
      env:
        TFE_HOSTNAME: "{  { tfe_hostname }}"
        TFE_ORGANIZATION: "{  { tfe_organization }}"
        TFE_TOKEN: "{  { tfe_token }}"
        # Token no formato esperado pelo backend remote do inventário
        # (TF_TOKEN_<hostname com . e - substituídos por _>)
        # Ajuste o sufixo para o hostname do seu TFE:
        TF_TOKEN_tfe_example_com: "{  { tfe_token }}"
# NOTA: remova o espaço dentro de "{  {" ao aplicar — está assim para não ser
# interpretado como template ao processar este arquivo com Ansible.
