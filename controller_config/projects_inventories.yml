---
# Projeto e inventários da demo (Configuration-as-Code)
controller_projects:
  - name: PROJ-TERRAFORM
    organization: BT
    scm_type: git
    scm_url: https://github.com/allanroque/bt.git
    scm_branch: main
    scm_update_on_launch: true       # atualiza a cada launch
    scm_update_cache_timeout: 0      # sem cache (sempre busca do git)
    scm_clean: true                  # working tree limpo a cada update
    default_environment: ee-demo-lab-bt

controller_inventories:
  # Inventário estático apenas com localhost (alvos: provision/destroy via TFE)
  - name: INV-LOCAL
    organization: BT
    description: Localhost para passos que rodam contra o TFE (provision/destroy)

  # Inventário dinâmico AWS EC2 (alvos: hosts provisionados pelo Terraform)
  - name: INV-TERRAFORM
    organization: BT
    description: Recursos AWS EC2 provisionados pelo Terraform Enterprise

controller_hosts:
  - name: localhost
    inventory: INV-LOCAL
    variables:
      ansible_connection: local
      # !unsafe preserva o literal para ser resolvido em tempo de execução do job
      ansible_python_interpreter: !unsafe "{{ ansible_playbook_python }}"

controller_inventory_sources:
  - name: AWS source for TFE resources
    inventory: INV-TERRAFORM
    organization: BT
    source: ec2
    credential: CRED-BT-AWS
    execution_environment: ee-demo-lab-bt
    overwrite: true
    update_on_launch: true
    verbosity: 1
    update_cache_timeout: 0
    source_vars: |
      ---
      hostnames:
        - tag:Name
      compose:
        ansible_host: public_ip_address
        ansible_ssh_pipelining: "true"
      regions:
        - us-east-2
