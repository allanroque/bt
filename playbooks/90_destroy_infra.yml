---
# Passo 3 do Workflow de Descomissionamento
# AAP aciona o Terraform Enterprise para destruir a infraestrutura
- name: Destroy infrastructure via Terraform Enterprise
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    tfe_hostname: "{{ lookup('env', 'TFE_HOSTNAME') | default('tfe.example.com', true) }}"
    tfe_token: "{{ lookup('env', 'TFE_TOKEN') }}"
    tfe_organization: "{{ lookup('env', 'TFE_ORGANIZATION') | default('redhat-demo', true) }}"
    tfe_workspace: "aws-webapp-demo"
    tfe_validate_certs: false

  tasks:
    - name: Trigger a TFE destroy run
      hashicorp.terraform.run:
        tf_hostname: "{{ tfe_hostname }}"
        tf_token: "{{ tfe_token }}"
        tf_validate_certs: "{{ tfe_validate_certs }}"
        organization: "{{ tfe_organization }}"
        workspace: "{{ tfe_workspace }}"
        run_message: "Decommission - destroy run triggered by AAP workflow"
        is_destroy: true
        auto_apply: true
        poll_interval: 5
        poll_timeout: 900
        state: present
      register: tfe_destroy_result

    - name: Show destroy result
      ansible.builtin.debug:
        var: tfe_destroy_result
